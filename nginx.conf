# Cache policy by file type, applied once at server level below.
#
# Doing it this way rather than with add_header inside per-type location blocks is
# deliberate: a location that sets any add_header stops inheriting the server-level
# ones. The static asset block used to do that, which quietly dropped CSP, HSTS and
# Referrer-Policy from every CSS and JS response.
#
# Datasets get the same policy as other static assets, so a data update reaches
# clients within the hour. Drop them back to the default if they ever need to be
# immediately fresh.
map $uri $cache_control {
    default                                                   "no-store, no-cache, must-revalidate";
    ~*\.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$  "public, max-age=3600, s-maxage=600";
    ~*\.(?:csv|geojson|json)$                                 "public, max-age=3600, s-maxage=600";
}

map $uri $surrogate_control {
    default                                                   "no-store";
    ~*\.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$  "max-age=600";
    ~*\.(?:csv|geojson|json)$                                 "max-age=600";
}

# Legacy HTTP/1.0 companion to Cache-Control. Left empty for cacheable responses,
# where it would contradict them; nginx omits a header whose value is empty.
map $cache_control $pragma {
    default                                  "no-cache";
    ~^public                                 "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Prevent insecure redirect chains when behind TLS-terminating proxy
    absolute_redirect off;
    port_in_redirect off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Caching, from the maps above. Static assets and datasets are cacheable;
    # everything else, including the SPA shell, is not.
    add_header Cache-Control $cache_control always;
    add_header Surrogate-Control $surrogate_control always;
    add_header Pragma $pragma always;

    # Content Security Policy - tightened with all recommended directives
    # Note: unsafe-inline/unsafe-eval required for RequireJS and Underscore.js templates
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://*.dbca.wa.gov.au https://*.wa.gov.au; img-src 'self' data: https:; connect-src 'self' https://*.dbca.wa.gov.au https://*.wa.gov.au; font-src 'self' data: https://*.dbca.wa.gov.au https://*.wa.gov.au; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /csp-report; report-to csp-endpoint;" always;

    # CSP Reporting endpoint group header (report-to directive support)
    add_header Report-To '{"group":"csp-endpoint","max_age":86400,"endpoints":[{"url":"/csp-report"}]}' always;

    # Block access to sensitive/config files that should not be publicly accessible
    location ~* ^/(nginx\.conf|Dockerfile|\.dockerignore|LICENSE|README\.md)$ {
        return 404;
    }
    location ~ /\. {
        return 404;
    }

    # Compression. The datasets under /data/ are the main win here - several are
    # multi-megabyte CSV and GeoJSON.
    # gzip_vary: a CDN fronts this service, so responses must vary on Accept-Encoding.
    # gzip_proxied: nginx skips compression for proxied requests by default, and this
    # always sits behind a TLS-terminating proxy.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # text/html is always included and can't be listed. PDF, XLSM, fonts and images
    # are left out - already compressed.
    gzip_types
        text/plain
        text/css
        text/javascript
        text/csv
        application/javascript
        application/json
        application/geo+json
        image/svg+xml;

    # .geojson and .csv aren't in nginx's mime.types, so they arrive as
    # application/octet-stream and gzip_types above skips them. Set the type here
    # instead of in a types{} block, which would replace the whole inherited map.
    # No add_header in these blocks, so the server-level headers still apply.
    location ~* \.geojson$ {
        default_type application/geo+json;
        try_files $uri =404;
    }
    location ~* \.csv$ {
        default_type text/csv;
        try_files $uri =404;
    }

    # CSP violation report sink (accept and discard - no backend to process)
    location = /csp-report {
        return 204;
    }

    # SPA routing - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prevent directory listing
    autoindex off;
}
