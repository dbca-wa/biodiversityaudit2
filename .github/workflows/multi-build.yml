# Builds and pushes the multi-architecture (amd64/arm64) image to GHCR
# using the shared docker-bake.hcl, so local and CI builds are identical.
name: Build multi-architecture image

on:
  schedule:
    - cron: '15 21 * * 1-5'
  push:
    branches:
      - main
      - dev
    tags:
      - '*'
  # PRs build both architectures without pushing, and the pr-scan job gates
  # the PR on the image it builds.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_ref: ${{ env.GHCR_IMAGE }}:${{ steps.image_tag.outputs.value }}
    permissions:
      contents: read
      packages: write # push image to GHCR
      attestations: write # image provenance / SLSA
      id-token: write # OIDC for provenance
    steps:
      - name: Harden the GitHub runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: image_tag
        shell: bash
        run: |
          set -euo pipefail
          # Parse any valid semver tag, including optional leading 'v' and prerelease/build metadata.
          tag="$(git tag --points-at HEAD | grep -E '^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' | head -n 1 || true)"
          if [ -n "$tag" ]; then
            # strip a leading 'v' (e.g. v1.2.3-rc.1 -> 1.2.3-rc.1)
            semtag="${tag#v}"
            {
              echo "value=${semtag}"
              echo "has_version_tag=true"
              echo "label_version=${semtag}"
            } >> "$GITHUB_OUTPUT"
          else
            # Untagged builds (pushes to main, the nightly schedule) get the
            # nearest release plus how far past it, e.g. 2.0.5-3-g1a2b3c4,
            # rather than a bare "latest".
            described="$(git describe --tags --always)"
            {
              echo "value=latest"
              echo "has_version_tag=false"
              echo "label_version=${described#v}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push with Docker Buildx
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          # Read by docker-bake.hcl to set the OCI version label.
          VERSION: ${{ steps.image_tag.outputs.label_version }}
        with:
          files: docker-bake.hcl
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            app.tags=${{ env.GHCR_IMAGE }}:latest
            ${{ steps.image_tag.outputs.has_version_tag == 'true' && format('app.tags={0}:{1}', env.GHCR_IMAGE, steps.image_tag.outputs.value) || '' }}

  scan:
    name: Docker image vulnerability scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: read
      packages: read
      security-events: write
    timeout-minutes: 30
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Pull the vuln DB from the GHCR mirror instead of public.ecr.aws,
          # which aggressively rate-limits anonymous pulls (TOOMANYREQUESTS).
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          # Authenticate the DB pull with the job's GITHUB_TOKEN so we are not
          # throttled as an anonymous client on shared runner IPs.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: 'image'
          scanners: 'vuln'
          image-ref: ${{ needs.build.outputs.image_ref }}
          # Include OS packages (apk), not just language libraries, so base
          # image vulnerabilities are reported.
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: 'trivy-results.sarif'

      # Fail the workflow on HIGH/CRITICAL vulnerabilities that have a fix
      # available. Unfixed upstream issues are still reported above but do
      # not block.
      - name: Fail on fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: 'image'
          scanners: 'vuln'
          image-ref: ${{ needs.build.outputs.image_ref }}
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'
          skip-setup-trivy: true

  # PR images are not pushed, so build the amd64 image into the runner's
  # Docker daemon and gate the PR on it.
  pr-scan:
    name: PR image vulnerability scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # authenticated pull of the Trivy DB from GHCR
    timeout-minutes: 30
    steps:
      - name: Harden the GitHub runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: biodiversityaudit2:scan

      - name: Fail on fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: 'image'
          scanners: 'vuln'
          image-ref: biodiversityaudit2:scan
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'
